:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA;
  --label:#000000; --label2:#6E6E73; --label3:#A1A1A6;
  --sep:#D8D8DC; --sep2:#E9E9EC;
  --blue:#007AFF; --red:#FF3B30; --green:#2FA35B; --amber:#B25E00;
  --chip:#F0F0F3; --chip-tx:#48484A;
  --ok-bg:#E6F4EC; --ok-tx:#1C7A45;
  --warn-bg:#FDF0DC; --warn-tx:#9A5E00;
  --stop-bg:#FDE8E7; --stop-tx:#C0231A;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang SC","Yu Gothic Medium","Microsoft YaHei","Noto Sans JP",-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:13px; --maph:38vh;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E;
  --label:#FFFFFF; --label2:#98989D; --label3:#6E6E73;
  --sep:#38383A; --sep2:#2C2C2E;
  --blue:#0A84FF; --red:#FF453A; --green:#30D158; --amber:#FF9F0A;
  --chip:#2C2C2E; --chip-tx:#C7C7CC;
  --ok-bg:#12301F; --ok-tx:#4FD37F;
  --warn-bg:#33270F; --warn-tx:#F0A93B;
  --stop-bg:#3A1A18; --stop-tx:#FF6961;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E;
  --label:#FFFFFF; --label2:#98989D; --label3:#6E6E73;
  --sep:#38383A; --sep2:#2C2C2E;
  --blue:#0A84FF; --red:#FF453A; --green:#30D158; --amber:#FF9F0A;
  --chip:#2C2C2E; --chip-tx:#C7C7CC;
  --ok-bg:#12301F; --ok-tx:#4FD37F;
  --warn-bg:#33270F; --warn-tx:#F0A93B;
  --stop-bg:#3A1A18; --stop-tx:#FF6961;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--label);font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}

.top{position:sticky;top:0;z-index:500;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 var(--sep2)}
#map{height:var(--maph);width:100%;background:var(--card2);z-index:1}
.leaflet-container{background:var(--card2);font-family:var(--sans)}
.pills{display:flex;gap:7px;overflow-x:auto;padding:9px 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:none;background:var(--chip);color:var(--label);font-family:var(--sans);
  font-size:14.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 auto}
.pill[aria-selected="true"]{background:var(--blue);color:#fff}
.pill[aria-selected="true"] i{background:#fff!important}
.pill:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.wrap{padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.dhead{padding:16px 16px 4px}
.dhead h1{margin:0;font-family:var(--jp);font-size:25px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.dhead .sub{color:var(--label2);font-size:14.5px;margin-top:3px}
.dhead .dt{font-family:var(--mono);font-size:12.5px;color:var(--label3);margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.badge{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:7px}
.badge.ok{background:var(--ok-bg);color:var(--ok-tx)}
.badge.warn{background:var(--warn-bg);color:var(--warn-tx)}
.badge.stop{background:var(--stop-bg);color:var(--stop-tx)}
.badge.plain{background:var(--chip);color:var(--chip-tx)}

.tl{padding:14px 16px 0;display:grid;gap:0}
.row{display:grid;grid-template-columns:46px 1fr;gap:10px;position:relative}
.row::before{content:"";position:absolute;left:52px;top:20px;bottom:0;width:2px;background:var(--sep2);border-radius:2px}
.row:last-child::before{display:none}
.rt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--label2);text-align:right;padding-top:13px;letter-spacing:-.03em}
.rb{position:relative;padding:0 0 12px 16px}
.rb::before{content:"";position:absolute;left:-4px;top:15px;width:11px;height:11px;border-radius:50%;
  background:var(--dc,var(--label3));box-shadow:0 0 0 3px var(--bg);z-index:2}
.row[data-k="move"] .rb::before{background:var(--bg);border:2.5px solid var(--label3);width:12px;height:12px;left:-4.5px}

.card{background:var(--card);border-radius:var(--r);padding:12px 13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.nm{font-family:var(--jp);font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.en{color:var(--label2);font-size:14px;margin-top:1px}
.meta{font-family:var(--mono);font-size:12px;color:var(--label3);margin-top:5px}
.note{font-size:14px;color:var(--label2);margin-top:7px;line-height:1.45}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--chip-tx);
  font-family:var(--mono)}
.chip.yen{font-weight:700}
.chip.pay{background:var(--ok-bg);color:var(--ok-tx);font-family:var(--sans)}
.chip.cash{background:var(--warn-bg);color:var(--warn-tx);font-family:var(--sans)}
.chip.resv{background:var(--warn-bg);color:var(--warn-tx);font-family:var(--sans)}
.chip.shut{background:var(--stop-bg);color:var(--stop-tx);font-family:var(--sans)}

.btns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  font-size:14.5px;font-weight:600;padding:9px 15px;border-radius:9px;background:var(--blue);color:#fff;
  min-height:38px;font-family:var(--sans)}
.btn.tab{background:var(--chip);color:var(--label)}
.btn:active{opacity:.7}
.btn:focus-visible{outline:2px solid var(--label);outline-offset:2px}

.cands{margin-top:10px;display:grid;gap:8px}
.cand{background:var(--card2);border-radius:11px;padding:10px 12px}
.cand.shut{opacity:.55}
.cand.shut .cnm{text-decoration:line-through;text-decoration-thickness:1.5px}
.cnm{font-family:var(--jp);font-size:15.5px;font-weight:600;line-height:1.3}
.crom{display:block;color:var(--label3);font-size:12.5px;font-weight:400;font-family:var(--sans);margin-top:1px}

.call{margin:16px 16px 0;background:var(--card);border-radius:var(--r);padding:13px;border-left:4px solid var(--amber)}
.call.risk{border-left-color:var(--red)} .call.good{border-left-color:var(--green)}
.call h3{margin:0 0 5px;font-family:var(--jp);font-size:15px;font-weight:700}
.call p{margin:0;font-size:14px;color:var(--label2)} .call p+p{margin-top:7px}
.call b{color:var(--label);font-weight:600}
.cut{margin:16px 16px 0;background:var(--card);border-radius:var(--r);padding:13px}
.cut h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--label2)}
.cut div{font-size:13.5px;color:var(--label3);padding:5px 0;border-top:1px solid var(--sep2)}
.cut div:first-of-type{border-top:none}
.cut b{color:var(--label2);font-family:var(--jp);font-weight:600}

.ov{padding:12px 16px 0;display:grid;gap:9px}
.ovc{background:var(--card);border-radius:var(--r);padding:13px;display:grid;grid-template-columns:auto 1fr auto;
  gap:11px;align-items:center;cursor:pointer;text-align:left;border:none;font-family:var(--sans);width:100%}
.ovc i{width:11px;height:11px;border-radius:50%;display:block}
.ovc .t{font-family:var(--jp);font-size:16.5px;font-weight:600;color:var(--label);line-height:1.25;display:block}
.ovc .s{font-size:13.5px;color:var(--label2);margin-top:1px;display:block}
.ovc .d{font-family:var(--mono);font-size:12.5px;color:var(--label3);text-align:right}
.ovc:active{opacity:.6}

.foot{padding:26px 16px 0;color:var(--label3);font-size:12.5px;line-height:1.5}
.foot p{margin:0 0 8px;max-width:60ch}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

var map=L.map("map",{zoomControl:false,attributionControl:false});
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,minZoom:5,crossOrigin:true}).addTo(map);
L.control.attribution({position:"bottomright",prefix:false}).addAttribution("&copy; OpenStreetMap").addTo(map);
var layer=L.layerGroup().addTo(map);

function drawMap(idx){
  layer.clearLayers();
  var pts=[],col=null;
  if(idx<0){
    DAYS.forEach(function(d,i){
      d.ev.forEach(function(e){ if(e.p&&P[e.p]) pts.push([P[e.p][0],P[e.p][1],C[i],P[e.p][2]]); });
    });
  }else{
    col=C[idx];
    DAYS[idx].ev.forEach(function(e){ if(e.p&&P[e.p]) pts.push([P[e.p][0],P[e.p][1],col,P[e.p][2]]); });
  }
  if(!pts.length){ map.setView([35.30,136.60],7); return; }
  if(idx>=0&&pts.length>1){
    L.polyline(pts.map(function(p){return [p[0],p[1]];}),
      {color:col,weight:2.5,opacity:.55,dashArray:"5,6"}).addTo(layer);
  }
  pts.forEach(function(p){
    var m=L.circleMarker([p[0],p[1]],{radius:8,color:"#fff",weight:2.5,fillColor:p[2],fillOpacity:1}).addTo(layer);
    m.bindTooltip(p[3],{direction:"top",offset:[0,-8]});
    m.on("click",function(){ window.open(g(p[3],""),"_blank","noopener"); });
  });
  map.fitBounds(L.latLngBounds(pts.map(function(p){return [p[0],p[1]];})),{padding:[34,34],maxZoom:15});
}

var pills=document.getElementById("pills"), pane=document.getElementById("pane");

function mkPill(label,i,color){
  var b=document.createElement("button");
  b.className="pill"; b.setAttribute("role","tab");
  b.setAttribute("aria-selected", i===-1?"true":"false");
  b.innerHTML=(color?'<i style="background:'+color+'"></i>':"")+esc(label);
  b.onclick=function(){show(i);};
  pills.appendChild(b);
}
mkPill("総覧",-1,null);
DAYS.forEach(function(d,i){
  var dt=new Date(d.d+"T00:00:00");
  mkPill("D"+(i+1)+" "+(dt.getMonth()+1)+"/"+dt.getDate(),i,C[i]);
});

function payChips(r){
  var out="";
  if(r.pay&&r.pay.indexOf("💳")>=0) out+='<span class="chip pay">カード</span>';
  if(r.pay&&r.pay.indexOf("🍉")>=0) out+='<span class="chip pay">Suica</span>';
  if(!r.pay) out+='<span class="chip cash">現金のみ？</span>';
  if(r.resv) out+='<span class="chip resv">要予約</span>';
  return out;
}

function candCard(key,dow){
  var r=R[key]; if(!r) return "";
  var shut=(r.shut||[]).indexOf(dow)>=0;
  var h='<div class="cand'+(shut?" shut":"")+'">';
  h+='<div class="cnm">'+esc(r.jp)+(r.rom?'<span class="crom">'+esc(r.rom)+'</span>':"")+'</div>';
  h+='<div class="chips">';
  if(shut) h+='<span class="chip shut">'+W[dow]+'曜 休み</span>';
  if(r.hrs) h+='<span class="chip">'+esc(r.hrs)+'</span>';
  if(r.yen) h+='<span class="chip yen">¥'+r.yen.toLocaleString()+'</span>';
  h+=payChips(r)+'</div>';
  if(r.note) h+='<div class="note">'+esc(r.note)+'</div>';
  if(!r.nolink){
    h+='<div class="btns"><a class="btn" href="'+g(r.jp,r.area)+'" target="_blank" rel="noopener">📍 導航</a>'+
       '<a class="btn tab" href="'+tabelog(r.jp)+'" target="_blank" rel="noopener">食べログ</a></div>';
  }
  return h+'</div>';
}

function show(idx){
  [].forEach.call(pills.children,function(b,j){ b.setAttribute("aria-selected",(j-1)===idx?"true":"false"); });
  drawMap(idx);
  if(idx<0) renderOverview(); else renderDay(idx);
  window.scrollTo(0,0);
}

function renderDay(i){
  var d=DAYS[i], dt=new Date(d.d+"T00:00:00"), dow=dt.getDay();
  var h='<div class="dhead"><h1>'+esc(d.t)+'</h1><div class="sub">'+esc(d.en)+'</div>'+
    '<div class="dt">'+d.d+'（'+W[dow]+'）· '+WE[dow]+'</div></div>';
  if(d.badges) h+='<div class="badges">'+d.badges.map(function(b){
    return '<span class="badge '+b[0]+'">'+esc(b[1])+'</span>';}).join("")+'</div>';
  h+='<div class="tl">';
  d.ev.forEach(function(e){
    h+='<div class="row" data-k="'+(e.k||"")+'"><div class="rt">'+esc(e.t)+'</div>'+
       '<div class="rb" style="--dc:'+C[i]+'"><div class="card">';
    h+='<div class="nm">'+esc(e.n)+'</div>';
    if(e.en) h+='<div class="en">'+esc(e.en)+'</div>';
    if(e.m) h+='<div class="meta">'+esc(e.m)+'</div>';
    if(e.note) h+='<div class="note">'+esc(e.note)+'</div>';
    if(e.p&&P[e.p]) h+='<div class="btns"><a class="btn" href="'+g(P[e.p][2],P[e.p][3])+'" target="_blank" rel="noopener">📍 導航</a></div>';
    if(e.c&&e.c.length) h+='<div class="cands">'+e.c.map(function(k){return candCard(k,dow);}).join("")+'</div>';
    h+='</div></div></div>';
  });
  h+='</div>';
  if(d.call) h+='<div class="call '+(d.call.cls||"")+'"><h3>'+esc(d.call.h)+'</h3>'+
    d.call.p.map(function(p){return "<p>"+p+"</p>";}).join("")+'</div>';
  if(d.cut) h+='<div class="cut"><h3>今日の削除</h3>'+d.cut.map(function(c){
    return '<div><b>'+esc(c[0])+'</b> — '+esc(c[1])+'</div>';}).join("")+'</div>';
  h+=foot();
  pane.innerHTML=h;
}

function foot(){
  return '<div class="foot"><div class="legend">'+
   '<span class="chip pay">カード</span><span class="chip pay">Suica</span>'+
   '<span class="chip cash">現金のみ？</span><span class="chip resv">要予約</span></div>'+
   '<p>店名の下のボタンで Google マップ、食べログ は営業時間・定休日・評価の確認用。地図のピンもタップできます。</p>'+
   '<p>営業時間・定休日・価格は手元のメモ、追加分は Tabelog と店舗サイトで 2026-09-22 に確認。日本は上海より1時間進んでいます。重要なものは当日必ず再確認を。</p></div>';
}

show(-1);
setTimeout(function(){ map.invalidateSize(); },150);
window.addEventListener("resize",function(){ map.invalidateSize(); });
window.addEventListener("orientationchange",function(){ setTimeout(function(){map.invalidateSize();},250); });

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
