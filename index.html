<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>関西 → 関東</title>
<meta name="description" content="大阪・京都・东京 2026-09-28 → 10-06">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#FFF0F5" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#1A0F16" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="关西→关东">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
  --bg:#FFF0F5; --card:#FFFFFF; --card2:#FFF7FA;
  --label:#3A1F2B; --label2:#8B6675; --label3:#B993A4;
  --sep:#F6D8E4; --sep2:#FBE8F0;
  --pink:#EC4E8C; --pink-soft:#FFD3E4; --pink-deep:#C4266A;
  --blue:#EC4E8C; --amber:#D98324; --green:#3E9B6B; --red:#E0446B;
  --chip:#FDEBF2; --chip-tx:#9A5C77;
  --ok-bg:#E4F5EC; --ok-tx:#2E7A54;
  --warn-bg:#FDF0DB; --warn-tx:#9A5E00;
  --stop-bg:#FFE4EC; --stop-tx:#C0265C;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --jp:"PingFang SC","Hiragino Sans GB","Hiragino Sans","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:18px; --maph:36vh;
  --shadow:0 2px 10px rgba(236,78,140,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A0F16; --card:#261823; --card2:#2F1E2B;
  --label:#FFEAF3; --label2:#C9A3B5; --label3:#9B7688;
  --sep:#3E2835; --sep2:#33202C;
  --pink:#FF7FB0; --pink-soft:#5A2E44; --pink-deep:#FFA6C8;
  --blue:#FF7FB0; --amber:#F0A93B; --green:#5FD198; --red:#FF8FAB;
  --chip:#3A2431; --chip-tx:#E0B9CB;
  --ok-bg:#16301F; --ok-tx:#6FD3A0;
  --warn-bg:#33270F; --warn-tx:#F0A93B;
  --stop-bg:#42202F; --stop-tx:#FF9FBC;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#1A0F16; --card:#261823; --card2:#2F1E2B;
  --label:#FFEAF3; --label2:#C9A3B5; --label3:#9B7688;
  --sep:#3E2835; --sep2:#33202C;
  --pink:#FF7FB0; --pink-soft:#5A2E44; --pink-deep:#FFA6C8;
  --blue:#FF7FB0; --amber:#F0A93B; --green:#5FD198; --red:#FF8FAB;
  --chip:#3A2431; --chip-tx:#E0B9CB;
  --ok-bg:#16301F; --ok-tx:#6FD3A0;
  --warn-bg:#33270F; --warn-tx:#F0A93B;
  --stop-bg:#42202F; --stop-tx:#FF9FBC;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--label);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}

.top{position:sticky;top:0;z-index:500;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 8px rgba(236,78,140,.08)}
#map{height:var(--maph);width:100%;background:var(--card2);z-index:1;
  border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.leaflet-container{background:var(--card2);font-family:var(--sans)}
.pills{display:flex;gap:7px;overflow-x:auto;padding:10px 14px 11px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:none;background:var(--chip);color:var(--label);font-family:var(--sans);
  font-size:14.5px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 auto}
.pill[aria-selected="true"]{background:var(--pink);color:#fff;box-shadow:0 2px 8px rgba(236,78,140,.35)}
.pill[aria-selected="true"] i{background:#fff!important}
.pill:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.wrap{padding:0 0 calc(44px + env(safe-area-inset-bottom,0px))}
.dhead{padding:18px 16px 4px;position:relative}
.dhead h1{margin:0;font-family:var(--jp);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.dhead .sub{color:var(--label2);font-size:14.5px;margin-top:4px}
.dhead .dt{font-family:var(--mono);font-size:12.5px;color:var(--label3);margin-top:3px}
.bow{width:26px;height:20px;vertical-align:-2px;margin-right:7px}
.badges{display:flex;gap:6px;flex-wrap:wrap;padding:11px 16px 0}
.badge{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok-tx)}
.badge.warn{background:var(--warn-bg);color:var(--warn-tx)}
.badge.stop{background:var(--stop-bg);color:var(--stop-tx)}
.badge.plain{background:var(--chip);color:var(--chip-tx)}

.tl{padding:14px 16px 0;display:grid;gap:0}
.row{display:grid;grid-template-columns:46px 1fr;gap:10px;position:relative}
.row::before{content:"";position:absolute;left:52px;top:22px;bottom:0;width:2px;
  background:repeating-linear-gradient(to bottom,var(--sep) 0 5px,transparent 5px 10px)}
.row:last-child::before{display:none}
.rt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--label2);text-align:right;padding-top:15px;letter-spacing:-.03em}
.rb{position:relative;padding:0 0 13px 17px}
.rb::before{content:"";position:absolute;left:-5px;top:16px;width:13px;height:13px;border-radius:50%;
  background:var(--dc,var(--label3));box-shadow:0 0 0 3.5px var(--bg);z-index:2}
.row[data-k="move"] .rb::before{background:var(--bg);border:3px solid var(--dc,var(--label3))}

.card{background:var(--card);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.nm{font-family:var(--jp);font-size:17.5px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.en{color:var(--label2);font-size:13.5px;margin-top:2px}
.meta{font-family:var(--mono);font-size:12px;color:var(--label3);margin-top:6px}
.note{font-size:14px;color:var(--label2);margin-top:8px;line-height:1.6}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--chip-tx);
  font-family:var(--mono)}
.chip.yen{font-weight:700}
.chip.pay{background:var(--ok-bg);color:var(--ok-tx);font-family:var(--sans)}
.chip.cash{background:var(--warn-bg);color:var(--warn-tx);font-family:var(--sans)}
.chip.resv{background:var(--warn-bg);color:var(--warn-tx);font-family:var(--sans)}
.chip.shut{background:var(--stop-bg);color:var(--stop-tx);font-family:var(--sans)}

.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  font-size:14.5px;font-weight:700;padding:10px 17px;border-radius:999px;background:var(--pink);color:#fff;
  min-height:40px;font-family:var(--sans);box-shadow:0 2px 7px rgba(236,78,140,.28)}
.btn.tab{background:var(--chip);color:var(--pink-deep);box-shadow:none}
.btn.tkt{background:var(--pink-deep);border:none;cursor:pointer}
a.gomap,.nm.gomap{display:block;color:inherit}
.nm.gomap::after{content:" 📍";font-size:.72em;opacity:.75;vertical-align:1px}
.cnm.gomap::after{content:" 📍";font-size:.72em;opacity:.75}
a.gomap:active{opacity:.6}
a.gomap:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:6px}

/* 更新提示 */
.toast{position:fixed;left:14px;right:14px;z-index:9500;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--pink);color:#fff;border:none;border-radius:999px;
  padding:14px 18px;font-size:15px;font-weight:700;font-family:var(--sans);
  box-shadow:0 6px 22px rgba(236,78,140,.45);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.toast[hidden]{display:none!important}
@media (min-width:560px){.toast{left:50%;right:auto;transform:translateX(-50%);min-width:320px}}

/* 交通方案弹窗 */
.sheet{position:fixed;inset:0;z-index:9100;background:rgba(40,18,29,.55);
  display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none!important}
.sheet-in{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;
  max-height:86vh;overflow-y:auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sheet-h h3{margin:0;font-size:18px;font-weight:700;font-family:var(--jp)}
.sheet-h .cnt{background:var(--chip);color:var(--chip-tx);font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:999px}
.sheet-sub{font-size:13.5px;color:var(--label2);margin:0 0 14px;font-family:var(--jp);font-weight:600}
.sheet-sub b{color:var(--pink-deep)}
.opt{background:var(--card);border-radius:16px;padding:12px 13px;margin-bottom:9px;
  display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;box-shadow:var(--shadow)}
.opt .ic{font-size:24px;line-height:1.1}
.opt .l{font-size:15.5px;font-weight:700;font-family:var(--jp);line-height:1.3}
.opt .d{font-size:13px;color:var(--label2);margin-top:3px;line-height:1.45}
.opt .d b{color:var(--label);font-weight:700}
.opt .fn{font-size:11.5px;color:var(--label3);margin-top:4px;font-family:var(--mono)}
.opt .r{text-align:right;white-space:nowrap}
.opt .fare{font-size:17px;font-weight:700;color:var(--pink-deep);font-family:var(--mono)}
.opt .fare.free{color:var(--ok-tx);font-family:var(--sans);font-size:15px}
.opt .tm{font-size:12px;color:var(--label3);font-family:var(--mono);margin-top:2px}
.rec{background:var(--ok-bg);color:var(--ok-tx);font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.estflag{background:var(--warn-bg);color:var(--warn-tx);font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.sheet .gmap{display:block;text-align:center;background:var(--chip);color:var(--pink-deep);
  border-radius:999px;padding:12px;font-weight:700;font-size:14.5px;margin-top:4px;min-height:44px}
.sheet .close{width:100%;background:var(--pink);color:#fff;border:none;border-radius:999px;
  padding:13px;font-size:15.5px;font-weight:700;font-family:var(--sans);cursor:pointer;margin-top:9px;min-height:46px}
.sheet .none{font-size:14px;color:var(--label2);background:var(--card);border-radius:16px;padding:14px;margin-bottom:9px}

/* 票券灯箱 */
.lb{position:fixed;inset:0;z-index:9000;background:rgba(40,18,29,.94);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:20px calc(18px + env(safe-area-inset-left,0px));
  padding-top:calc(20px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.lb[hidden]{display:none!important}
.lb-card{background:var(--bg);border-radius:20px;padding:20px 18px;width:100%;max-width:400px;
  max-height:74vh;overflow-y:auto;box-shadow:0 8px 34px rgba(0,0,0,.4)}
.lb-card h4{margin:0;font-family:var(--jp);font-size:19px;font-weight:700;color:var(--label);text-align:center}
.lb-card .sub{margin:3px 0 0;font-size:13px;color:var(--label2);text-align:center}
.lb-code{margin:16px 0;background:var(--card);border:2px dashed var(--pink);border-radius:14px;padding:14px;text-align:center}
.lb-code .cl{font-size:11.5px;font-weight:700;color:var(--label2);letter-spacing:.08em}
.lb-code .cv{font-family:var(--mono);font-size:27px;font-weight:700;color:var(--pink-deep);
  letter-spacing:.06em;margin-top:5px;word-break:break-all;-webkit-user-select:all;user-select:all}
.lb-rows{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px}
.lb-rows div{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 13px;
  border-top:1px solid var(--sep2);font-size:13.5px}
.lb-rows div:first-child{border-top:none}
.lb-rows b{color:var(--label2);font-weight:600}
.lb-rows span{color:var(--label);font-weight:600;font-family:var(--jp)}
.tset{margin-bottom:16px}
.twho{font-family:var(--jp);font-size:15px;font-weight:700;color:var(--pink-deep);
  background:var(--chip);border-radius:999px;padding:6px 14px;display:inline-block;margin-bottom:9px}
.tlab{font-size:12px;font-weight:700;color:var(--label2);margin:0 0 5px 2px}
.lb-card img{width:100%;border-radius:14px;background:#fff;margin-bottom:14px;display:block}
.lb-card .tnote{font-size:13px;color:var(--label2);line-height:1.6;margin:0}
.lb-card .tnote b{color:var(--label)}
.lb-link{display:block;text-align:center;background:var(--pink);color:#fff;border-radius:999px;
  padding:13px;font-weight:700;font-size:15px;margin-bottom:13px;min-height:46px}
.lb .close{background:#fff;color:#C4266A;border:none;border-radius:999px;padding:11px 26px;
  font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer;min-height:44px}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px}

.cands{margin-top:11px;display:grid;gap:9px}
.cand{background:var(--card2);border-radius:15px;padding:11px 13px;border:1.5px solid var(--sep2)}
.cand.shut{opacity:.5}
.cand.shut .cnm{text-decoration:line-through;text-decoration-thickness:1.5px}
.cnm{font-family:var(--jp);font-size:15.5px;font-weight:700;line-height:1.35}
.crom{display:block;color:var(--label3);font-size:12.5px;font-weight:400;font-family:var(--sans);margin-top:1px}

.call{margin:16px 16px 0;background:var(--card);border-radius:var(--r);padding:14px 15px;
  border:2px solid var(--amber);box-shadow:var(--shadow)}
.call.risk{border-color:var(--red)} .call.good{border-color:var(--green)}
.call h3{margin:0 0 6px;font-family:var(--jp);font-size:15.5px;font-weight:700}
.call p{margin:0;font-size:14px;color:var(--label2);line-height:1.6} .call p+p{margin-top:8px}
.call b{color:var(--label);font-weight:700}
.cut{margin:16px 16px 0;background:var(--card);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.cut h3{margin:0 0 9px;font-size:13.5px;font-weight:700;color:var(--label2)}
.cut div{font-size:13.5px;color:var(--label3);padding:6px 0;border-top:1.5px dashed var(--sep2);line-height:1.55}
.cut div:first-of-type{border-top:none}
.cut b{color:var(--label2);font-family:var(--jp);font-weight:700}

.ov{padding:12px 16px 0;display:grid;gap:10px}
.ovc{background:var(--card);border-radius:var(--r);padding:14px 15px;display:grid;grid-template-columns:auto 1fr auto;
  gap:12px;align-items:center;cursor:pointer;text-align:left;border:none;font-family:var(--sans);width:100%;
  box-shadow:var(--shadow)}
.ovc i{width:12px;height:12px;border-radius:50%;display:block}
.ovc .t{font-family:var(--jp);font-size:16.5px;font-weight:700;color:var(--label);line-height:1.3;display:block}
.ovc .s{font-size:13.5px;color:var(--label2);margin-top:2px;display:block}
.ovc .d{font-family:var(--mono);font-size:12.5px;color:var(--label3);text-align:right}
.ovc:active{transform:scale(.985)}

.fhead{padding:18px 16px 2px}
.fhead h1{margin:0;font-family:var(--jp);font-size:25px;font-weight:700}
.fhead .sub{color:var(--label2);font-size:14px;margin-top:4px;line-height:1.55}
.farea{padding:20px 16px 0}
.farea h2{margin:0;font-family:var(--jp);font-size:17.5px;font-weight:700;color:var(--label);
  display:flex;align-items:center;gap:7px}
.farea .fit{font-size:13px;color:var(--label2);margin:4px 0 11px;line-height:1.5}
.fcard{background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.fcard .fn{font-family:var(--jp);font-size:16px;font-weight:700;line-height:1.3}
.fcard .fe{color:var(--label2);font-size:12.5px;margin-top:2px}
.fcard .fa{font-size:12.5px;color:var(--label3);margin-top:7px;line-height:1.5;
  padding-left:17px;text-indent:-17px}
.rv{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;font-family:var(--sans)}
.rv.need{background:var(--stop-bg);color:var(--stop-tx)}
.rv.can{background:var(--ok-bg);color:var(--ok-tx)}
.rv.queue{background:var(--chip);color:var(--chip-tx)}
.foot{padding:28px 16px 0;color:var(--label3);font-size:12.5px;line-height:1.6}
.foot p{margin:0 0 8px;max-width:60ch}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;transform:none!important}}
</style>
</head>
<body>

<div class="top">
  <div id="map"></div>
  <div class="pills" id="pills" role="tablist" aria-label="行程日"></div>
</div>
<div class="wrap" id="pane"></div>

<button class="toast" id="toast" type="button" hidden>🎀 行程已更新 · 点我刷新</button>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="交通方案">
  <div class="sheet-in">
    <div class="sheet-h"><span style="font-size:22px">🚋</span><h3>交通方案</h3><span class="cnt" id="shcnt"></span></div>
    <p class="sheet-sub" id="shsub"></p>
    <div id="shopts"></div>
    <a class="gmap" id="shgmap" target="_blank" rel="noopener">在 Google 地图看实时路线 →</a>
    <button class="close" id="shclose" type="button">关闭</button>
  </div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="票券">
  <div class="lb-card" id="lbcard"></div>
  <button class="close" id="lbclose" type="button">关闭</button>
</div>

<script src="leaflet.js"></script>
<script>
var W=["周日","周一","周二","周三","周四","周五","周六"];
function g(n,a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(n+" "+(a||""));}
var g_=g;
function tabelog(n){return "https://tabelog.com/rstLst/?sk="+encodeURIComponent(n);}
/* 路线：从上一个地点出发，公共交通模式（Google 会顺带显示票价） */
function dir(from,to){
  var u="https://www.google.com/maps/dir/?api=1&travelmode=transit&destination="+encodeURIComponent(to);
  if(from) u+="&origin="+encodeURIComponent(from);
  return u;
}

/* ---------- 交通方案 ----------
   已核实的票价写死在这里，离线也能看。est:1 = 估算，未逐一核实。
   没有对应条目的路段，只给「步行估算 + Google 实时」两项。 */
var LEG={
 "dtosaka>castle":[{m:"walk",l:"沿大手前通",d:"酒店正对公园西口",t:"~2min",f:0,rec:1}],
 "castle>shinsai":[
   {m:"metro",l:"大阪メトロ 中央线 → 御堂筋线",d:"谷町四丁目 → 本町 换乘 → 心斋桥",t:"~12min",f:190,est:1,rec:1},
   {m:"taxi",l:"出租车",d:"直达约4km",t:"~15min",f:1600,est:1}],

function haversine(a,b){
  var R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
  var la1=a[0]*Math.PI/180,la2=b[0]*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLon/2)*Math.sin(dLon/2)*Math.cos(la1)*Math.cos(la2);
  return 2*R*Math.asin(Math.sqrt(h));
}

}

var map=L.map("map",{zoomControl:false,attributionControl:false});
/* 底图都不需要 API key：
   浅色＝日本国土地理院「淡色地图」，日本境内细节最好，标注是日文；
   深色＝Esri Dark Gray Canvas。CARTO 现在要 key 了，用不了。 */
var TILE_L="https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png";
var TILE_D="https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}";
function wantDark(){
  var t=document.documentElement.getAttribute("data-theme");
  if(t==="dark") return true;
  if(t==="light") return false;
  return !!(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches);
}
var tiles=L.tileLayer(wantDark()?TILE_D:TILE_L,
  {maxZoom:18,minZoom:5,crossOrigin:true}).addTo(map);
if(window.matchMedia){
  try{ matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(){
    tiles.setUrl(wantDark()?TILE_D:TILE_L);
  }); }catch(e){}
}
L.control.attribution({position:"bottomright",prefix:false})
  .addAttribution("国土地理院 / Esri").addTo(map);
var layer=L.layerGroup().addTo(map);

function drawMap(idx){
  layer.clearLayers();
  var pts=[],col=null;
  if(idx===-2){
    var fp=[];
    FOOD.forEach(function(gr,gi){
      if(!gr.ll) return;
      var bad=gr.fit.indexOf("⚠️")===0||gr.fit.indexOf("❌")===0;
      var m=L.circleMarker(gr.ll,{radius:10,color:"#fff",weight:3,
        fillColor:bad?"#B993A4":"#EC4E8C",fillOpacity:1}).addTo(layer);
      m.bindTooltip(gr.a+" · "+gr.keys.length+"家",{direction:"top",offset:[0,-9]});
      m.on("click",function(){
        var el=document.querySelectorAll(".farea")[gi];
        if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
      });
      fp.push(gr.ll);
    });
    if(fp.length) map.fitBounds(L.latLngBounds(fp),{padding:[38,38],maxZoom:13});
    return;
  }
  if(idx<0){
    DAYS.forEach(function(d,i){
      d.ev.forEach(function(e){ if(e.p&&P[e.p]) pts.push([P[e.p][0],P[e.p][1],C[i],P[e.p][2],P[e.p][4]]); });
    });
  }else{
    col=C[idx];
    DAYS[idx].ev.forEach(function(e){ if(e.p&&P[e.p]) pts.push([P[e.p][0],P[e.p][1],col,P[e.p][2],P[e.p][4]]); });
  }
  if(!pts.length){ map.setView([35.30,136.60],7); return; }
  if(idx>=0&&pts.length>1){
    L.polyline(pts.map(function(p){return [p[0],p[1]];}),
      {color:col,weight:3,opacity:.65,dashArray:"5,7"}).addTo(layer);
  }
  pts.forEach(function(p){
    var m=L.circleMarker([p[0],p[1]],{radius:8,color:"#fff",weight:3,fillColor:p[2],fillOpacity:1}).addTo(layer);
    m.bindTooltip(p[3],{direction:"top",offset:[0,-8]});
    m.on("click",function(){ window.open(g(p[4],""),"_blank","noopener"); });
  });
  map.fitBounds(L.latLngBounds(pts.map(function(p){return [p[0],p[1]];})),{padding:[34,34],maxZoom:15});
}

var pills=document.getElementById("pills"), pane=document.getElementById("pane");

function mkPill(label,i,color){
  var b=document.createElement("button");
  b.className="pill"; b.setAttribute("role","tab");
  b.setAttribute("aria-selected", i===-1?"true":"false");
  b.innerHTML=(color?'<i style="background:'+color+'"></i>':(i===-2?"🍜 ":"🎀 "))+esc(label);
  b.onclick=function(){show(i);};
  pills.appendChild(b);
}
mkPill("总览",-1,null);
mkPill("东京美食",-2,null);
DAYS.forEach(function(d,i){
  var dt=new Date(d.d+"T00:00:00");
  mkPill("D"+(i+1)+" "+(dt.getMonth()+1)+"/"+dt.getDate(),i,C[i]);
});

function payChips(r){
  var out="";
  if(r.pay&&r.pay.indexOf("💳")>=0) out+='<span class="chip pay">可刷卡</span>';
  if(r.pay&&r.pay.indexOf("🍉")>=0) out+='<span class="chip pay">Suica</span>';
  if(!r.pay) out+='<span class="chip cash">可能只收现金</span>';
  if(r.resv) out+='<span class="chip resv">需预约</span>';
  return out;
}

  if(!r.nolink){
    h+='<div class="btns"><a class="btn" href="'+dir(from,target)+'" target="_blank" rel="noopener">🚇 路线</a>'+
       '<a class="btn tab" href="'+tabelog(target)+'" target="_blank" rel="noopener">⭐ 查评分</a></div>';
  }
  return h+'</div>';
}

function show(idx){
  [].forEach.call(pills.children,function(b,j){
    var mine = (j===0) ? (idx===-1) : (j===1) ? (idx===-2) : ((j-2)===idx);
    b.setAttribute("aria-selected", mine?"true":"false"); });
  drawMap(idx);
  if(idx===-2) renderFood(); else if(idx<0) renderOverview(); else renderDay(idx);
  window.scrollTo(0,0);
}

function renderOverview(){
  var h='<div class="dhead"><h1>'+BOW+'关西 → 关东</h1>'+
    '<div class="sub">大阪2晚 · 京都2晚 · 东京4晚 — 关西机场进，羽田出</div>'+
    '<div class="dt">2026-09-28 → 10-06 · 2人</div></div><div class="ov">';
  DAYS.forEach(function(d,i){
    var dt=new Date(d.d+"T00:00:00");
    h+='<button class="ovc" data-i="'+i+'"><i style="background:'+C[i]+'"></i>'+
       '<span><span class="t">D'+(i+1)+' '+esc(d.t)+'</span><span class="s">'+esc(d.en)+'</span></span>'+
       '<span class="d">'+(dt.getMonth()+1)+'/'+dt.getDate()+'<br>'+W[dt.getDay()]+'</span></button>';
  });
  h+='</div>';
  h+='<div class="call risk"><h3>🎀 出发前必须办掉的事</h3>'+
     '<p><b>嵯峨野小火车 9/30 13:30</b> — 5号车（富贵号）不接受预售，只能当天在龟冈站 09:10 起排队先到先得。13:00 才到＝必然没有。现在就去查 1〜4号车还有没有位。</p>'+
     '<p><b>のぞみ 10/2 京都→东京</b> — 黄金周，务必订指定席，坐 <b>E 席</b>（C、D 都是过道座）。</p>'+
     '<p><b>需要预约</b> — 板前烧肉一斗、祐斋亭、炭烧鳗富士。<b>Suica</b> 出发前就加进 Apple Wallet。</p></div>';
  h+='<div class="call"><h3>🌸 付款提醒</h3>'+
     '<p>标「可能只收现金」的，是笔记里没写明能刷卡或用 IC 的店。日本的个人小店、路边摊、市场至今仍以现金为主。<b>身上随时备 ¥20,000 左右现金。</b></p></div>';
  h+=foot();
  pane.innerHTML=h;
  [].forEach.call(pane.querySelectorAll(".ovc"),function(b){
    b.onclick=function(){ show(parseInt(b.getAttribute("data-i"),10)); };
  });
}

function renderFood(){
  var h='<div class="fhead"><h1>🍜 东京美食 · 按区域</h1>'+
    '<div class="sub">你清单上所有东京的店，按区域分好。看「适合哪天」那一行就知道能塞进哪一天 —— 挑好了告诉我，我排进行程里。<br><b>地图上的粉点＝各个区域</b>，点一下跳到那一段；灰点是不顺路的区域。</div></div>';
  FOOD.forEach(function(g){
    h+='<div class="farea"><h2>📍 '+esc(g.a)+'</h2><div class="fit">'+esc(g.fit)+'</div>';
    g.keys.forEach(function(k){
      var r=R[k]; if(!r) return;
      h+='<div class="fcard"><div class="fn">'+esc(r.cn)+'</div>';
      if(r.en) h+='<div class="fe">'+esc(r.en)+'</div>';
      h+='<div class="chips">';
      if(r.hrs) h+='<span class="chip">'+esc(r.hrs)+'</span>';
      if(r.yen) h+='<span class="chip yen">¥'+r.yen.toLocaleString()+'</span>';
      h+=payChips(r);
      if(r.rv==="需预约") h+='<span class="rv need">需预约</span>';
      else if(r.rv==="可预约") h+='<span class="rv can">可预约</span>';
      else if(r.rv==="排队") h+='<span class="rv queue">只能排队</span>';
      h+='</div>';
      if(r.addr) h+='<div class="fa">📍 '+esc(r.addr)+'</div>';
      if(r.note) h+='<div class="note">'+esc(r.note)+'</div>';
      if(!r.nolink) h+='<div class="btns">'+
        '<a class="btn" href="'+g_(r.ja||r.cn,r.area)+'" target="_blank" rel="noopener">📍 导航</a>'+
        '<a class="btn tab" href="'+tabelog(r.ja||r.cn)+'" target="_blank" rel="noopener">⭐ 查评分</a></div>';
      h+='</div>';
    });
    h+='</div>';
  });
  h+='<div class="call"><h3>🎀 几个提醒</h3>'+
     '<p><b>新宿完全没安排。</b>凪（24小时）和船桥屋（明治19年创业）都在新宿，但九天里没有一天去 —— 要么专程，要么挤进 10/3 涩谷那晚。</p>'+
     '<p><b>鳗富士在日比谷OKUROJI</b>，新桥站7出口走3分钟，其实就在酒店旁边。营业到 22:00，不是你笔记写的 21:00。<b>它是唯一必须提前订的。</b></p>'+
     '<p>「只能排队」= 不接受预约，早去或错峰。价格是人均大概，以店家当天为准。</p></div>';
  h+=foot();
  pane.innerHTML=h;
}

function renderDay(i){
  var d=DAYS[i], dt=new Date(d.d+"T00:00:00"), dow=dt.getDay();
  var h='<div class="dhead"><h1>'+BOW+esc(d.t)+'</h1><div class="sub">'+esc(d.en)+'</div>'+
    '<div class="dt">'+d.d+' · '+W[dow]+'</div></div>';
  if(d.badges) h+='<div class="badges">'+d.badges.map(function(b){
    return '<span class="badge '+b[0]+'">'+esc(b[1])+'</span>';}).join("")+'</div>';
  h+='<div class="tl">';
  var prev=null, prevKey=null;
  d.ev.forEach(function(e){
    var pl=(e.p&&P[e.p])?P[e.p]:null;
    h+='<div class="row" data-k="'+(e.k||"")+'"><div class="rt">'+esc(e.t)+'</div>'+
       '<div class="rb" style="--dc:'+C[i]+'"><div class="card">';
    h+= pl ? '<a class="nm gomap" href="'+g(pl[4],"")+'" target="_blank" rel="noopener">'+esc(e.n)+'</a>'
           : '<div class="nm">'+esc(e.n)+'</div>';
    if(e.en) h+='<div class="en">'+esc(e.en)+'</div>';
    if(e.m) h+='<div class="meta">'+esc(e.m)+'</div>';
    if(e.note) h+='<div class="note">'+e.note+'</div>';
    var bt="";
    if(pl) bt+='<button class="btn rt-btn" type="button" data-from="'+esc(prevKey||"")+'" data-to="'+esc(e.p)+'">🚇 路线</button>';
    if(e.tid) bt+='<button class="btn tkt" type="button" data-tid="'+esc(e.tid)+'">🎫 票券</button>';
    if(bt) h+='<div class="btns">'+bt+'</div>';
    if(e.c&&e.c.length){
      var from=pl?pl[4]:prev;
      h+='<div class="cands">'+e.c.map(function(k){return candCard(k,dow,from);}).join("")+'</div>';
    }
    h+='</div></div></div>';
    if(pl){ prev=pl[4]; prevKey=e.p; }
  });
  h+='</div>';
  if(d.call) h+='<div class="call '+(d.call.cls||"")+'"><h3>'+esc(d.call.h)+'</h3>'+
    d.call.p.map(function(p){return "<p>"+p+"</p>";}).join("")+'</div>';
  if(d.cut) h+='<div class="cut"><h3>✂️ 今天砍掉的</h3>'+d.cut.map(function(c){
    return '<div><b>'+esc(c[0])+'</b> — '+esc(c[1])+'</div>';}).join("")+'</div>';
  h+=foot();
  pane.innerHTML=h;
}

function foot(){
  return '<div class="foot"><div class="legend">'+
   '<span class="chip pay">可刷卡</span><span class="chip pay">Suica</span>'+
   '<span class="chip cash">可能只收现金</span><span class="chip resv">需预约</span></div>'+
   '<p>「导航」开 Google 地图（用日文店名搜索，日本当地才搜得准），「查评分」开 Tabelog 看营业时间、定休日和评分。地图上的粉点也可以直接点。</p>'+
   '<p>营业时间、休息日、价格来自你自己的笔记；新增的部分已于 2026-09-22 用 Tabelog 和店家官网核对。日本比上海快1小时。重要的当天一定再确认一次。</p></div>';
}

/* 交通方案弹窗 */
var sheet=document.getElementById("sheet");
function closeSheet(){ sheet.hidden=true; }
document.getElementById("shclose").onclick=closeSheet;
sheet.addEventListener("click",function(ev){ if(ev.target===sheet) closeSheet(); });

function openSheet(fk,tk){
  var opts=legOptions(fk,tk);
  var fromName=fk&&P[fk]?P[fk][2]:"当前位置";
  var toName=P[tk]?P[tk][2]:tk;
  document.getElementById("shsub").innerHTML=esc(fromName)+" <b>→</b> "+esc(toName);
  document.getElementById("shcnt").textContent=opts.length?opts.length+" 个方案":"无数据";
  var h="";
  if(!opts.length){
    h='<div class="none">这一段我没有核实过的班次数据，别让我编。点下面用 Google 地图查实时路线。</div>';
  }
  opts.forEach(function(o){
    var mi=MODE[o.m]||["🚇","交通"];
    h+='<div class="opt"><div class="ic">'+mi[0]+'</div><div><div class="l">'+esc(o.l)+
       (o.rec?'<span class="rec">推荐</span>':"")+(o.est?'<span class="estflag">估算</span>':"")+'</div>'+
       '<div class="d">'+o.d+'</div>'+(o.fn?'<div class="fn">'+esc(o.fn)+'</div>':"")+'</div>'+
       '<div class="r"><div class="fare'+(o.f?"":" free")+'">'+(o.f?"¥"+o.f.toLocaleString():"免费")+'</div>'+
       '<div class="tm">'+esc(o.t)+'</div></div></div>';
  });
  document.getElementById("shopts").innerHTML=h;
  document.getElementById("shgmap").href=dir(fk&&P[fk]?P[fk][4]:null, P[tk]?P[tk][4]:tk);
  sheet.hidden=false;
}

/* 票券灯箱 */
var lb=document.getElementById("lb"), lbcard=document.getElementById("lbcard");
function closeLb(){ lb.hidden=true; lbcard.innerHTML=""; }
function openTicket(id){
  var k=TICKETS[id]||TICKETS.pending, h="";
  h+='<h4>'+esc(k.t)+'</h4>';
  if(k.sub) h+='<p class="sub">'+esc(k.sub)+'</p>';
  if(k.code) h+='<div class="lb-code"><div class="cl">'+esc(k.codeLabel||"预约码")+'</div>'+
    '<div class="cv">'+esc(k.code)+'</div></div>';
  if(k.img) h+='<img src="'+esc(k.img)+'" alt="票券">';
  if(k.sets) k.sets.forEach(function(st){
    h+='<div class="tset"><div class="twho">'+esc(st.who)+'</div>';
    st.items.forEach(function(it){
      h+='<div class="tlab">'+esc(it.l)+'</div><img src="'+esc(it.img)+'" alt="'+esc(st.who+" "+it.l)+'">';
    });
    h+='</div>';
  });
  if(k.rows&&k.rows.length) h+='<div class="lb-rows">'+k.rows.map(function(r){
    return '<div><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>';}).join("")+'</div>';
  if(k.link) h+='<a class="lb-link" href="'+esc(k.link)+'" target="_blank" rel="noopener">'+
    esc(k.linkLabel||"打开电子票")+' →</a>';
  if(k.note) h+='<p class="tnote">'+k.note+'</p>';
  lbcard.innerHTML=h;
  lb.hidden=false;
}
document.getElementById("lbclose").onclick=closeLb;
lb.addEventListener("click",function(ev){ if(ev.target===lb) closeLb(); });
document.addEventListener("keydown",function(ev){ if(ev.key==="Escape"&&!lb.hidden) closeLb(); });
pane.addEventListener("click",function(ev){
  if(!ev.target.closest) return;
  var t=ev.target.closest(".tkt");
  if(t){ openTicket(t.getAttribute("data-tid")); return; }
  var r=ev.target.closest(".rt-btn");
  if(r) openSheet(r.getAttribute("data-from")||null, r.getAttribute("data-to"));
});
document.addEventListener("keydown",function(ev){ if(ev.key==="Escape"&&!sheet.hidden) closeSheet(); });

show(-1);
setTimeout(function(){ map.invalidateSize(); },150);
window.addEventListener("resize",function(){ map.invalidateSize(); });
window.addEventListener("orientationchange",function(){ setTimeout(function(){map.invalidateSize();},250); });

/* 更新检测：新版本装好后弹提示，点一下刷新 */
if("serviceWorker" in navigator){
  var toast=document.getElementById("toast"), reg=null, hadController=!!navigator.serviceWorker.controller;
  toast.onclick=function(){ location.reload(); };

  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(hadController) toast.hidden=false;   // 首次安装不提示，只有真正的更新才提示
  });

  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(r){
      reg=r;
      r.addEventListener("updatefound",function(){
        var nw=r.installing;
        if(!nw) return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="activated"&&hadController) toast.hidden=false;
        });
      });
    }).catch(function(){});
  });

  /* 每次把 App 切回前台都查一次有没有新版本 */
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&reg) reg.update().catch(function(){});
  });
}
</script>
