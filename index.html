:root{
  --bg:#FFF0F5; --card:#FFFFFF; --card2:#FFF7FA;
  --label:#3A1F2B; --label2:#8B6675; --label3:#B993A4;
  --sep:#F6D8E4; --sep2:#FBE8F0;
  --pink:#EC4E8C; --pink-soft:#FFD3E4; --pink-deep:#C4266A;
  --blue:#EC4E8C; --amber:#D98324; --green:#3E9B6B; --red:#E0446B;
  --chip:#FDEBF2; --chip-tx:#9A5C77;
  --ok-bg:#E4F5EC; --ok-tx:#2E7A54;
  --warn-bg:#FDF0DB; --warn-tx:#9A5E00;
  --stop-bg:#FFE4EC; --stop-tx:#C0265C;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --jp:"PingFang SC","Hiragino Sans GB","Hiragino Sans","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:18px; --maph:36vh;
  --shadow:0 2px 10px rgba(236,78,140,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A0F16; --card:#261823; --card2:#2F1E2B;
  --label:#FFEAF3; --label2:#C9A3B5; --label3:#9B7688;
  --sep:#3E2835; --sep2:#33202C;
  --pink:#FF7FB0; --pink-soft:#5A2E44; --pink-deep:#FFA6C8;
  --blue:#FF7FB0; --amber:#F0A93B; --green:#5FD198; --red:#FF8FAB;
  --chip:#3A2431; --chip-tx:#E0B9CB;
  --ok-bg:#16301F; --ok-tx:#6FD3A0;
  --warn-bg:#33270F; --warn-tx:#F0A93B;
  --stop-bg:#42202F; --stop-tx:#FF9FBC;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#1A0F16; --card:#261823; --card2:#2F1E2B;
  --label:#FFEAF3; --label2:#C9A3B5; --label3:#9B7688;
  --sep:#3E2835; --sep2:#33202C;
  --pink:#FF7FB0; --pink-soft:#5A2E44; --pink-deep:#FFA6C8;
  --blue:#FF7FB0; --amber:#F0A93B; --green:#5FD198; --red:#FF8FAB;
  --chip:#3A2431; --chip-tx:#E0B9CB;
  --ok-bg:#16301F; --ok-tx:#6FD3A0;
  --warn-bg:#33270F; --warn-tx:#F0A93B;
  --stop-bg:#42202F; --stop-tx:#FF9FBC;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--label);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}

.top{position:sticky;top:0;z-index:500;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 8px rgba(236,78,140,.08)}
#map{height:var(--maph);width:100%;background:var(--card2);z-index:1;
  border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.leaflet-container{background:var(--card2);font-family:var(--sans)}
.pills{display:flex;gap:7px;overflow-x:auto;padding:10px 14px 11px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:none;background:var(--chip);color:var(--label);font-family:var(--sans);
  font-size:14.5px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 auto}
.pill[aria-selected="true"]{background:var(--pink);color:#fff;box-shadow:0 2px 8px rgba(236,78,140,.35)}
.pill[aria-selected="true"] i{background:#fff!important}
.pill:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.wrap{padding:0 0 calc(44px + env(safe-area-inset-bottom,0px))}
.dhead{padding:18px 16px 4px;position:relative}
.dhead h1{margin:0;font-family:var(--jp);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.dhead .sub{color:var(--label2);font-size:14.5px;margin-top:4px}
.dhead .dt{font-family:var(--mono);font-size:12.5px;color:var(--label3);margin-top:3px}
.bow{width:26px;height:20px;vertical-align:-2px;margin-right:7px}
.badges{display:flex;gap:6px;flex-wrap:wrap;padding:11px 16px 0}
.badge{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok-tx)}
.badge.warn{background:var(--warn-bg);color:var(--warn-tx)}
.badge.stop{background:var(--stop-bg);color:var(--stop-tx)}
.badge.plain{background:var(--chip);color:var(--chip-tx)}

.tl{padding:14px 16px 0;display:grid;gap:0}
.row{display:grid;grid-template-columns:46px 1fr;gap:10px;position:relative}
.row::before{content:"";position:absolute;left:52px;top:22px;bottom:0;width:2px;
  background:repeating-linear-gradient(to bottom,var(--sep) 0 5px,transparent 5px 10px)}
.row:last-child::before{display:none}
.rt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--label2);text-align:right;padding-top:15px;letter-spacing:-.03em}
.rb{position:relative;padding:0 0 13px 17px}
.rb::before{content:"";position:absolute;left:-5px;top:16px;width:13px;height:13px;border-radius:50%;
  background:var(--dc,var(--label3));box-shadow:0 0 0 3.5px var(--bg);z-index:2}
.row[data-k="move"] .rb::before{background:var(--bg);border:3px solid var(--dc,var(--label3))}

.card{background:var(--card);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.nm{font-family:var(--jp);font-size:17.5px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.en{color:var(--label2);font-size:13.5px;margin-top:2px}
.meta{font-family:var(--mono);font-size:12px;color:var(--label3);margin-top:6px}
.note{font-size:14px;color:var(--label2);margin-top:8px;line-height:1.6}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--chip-tx);
  font-family:var(--mono)}
.chip.yen{font-weight:700}
.chip.pay{background:var(--ok-bg);color:var(--ok-tx);font-family:var(--sans)}
.chip.cash{background:var(--warn-bg);color:var(--warn-tx);font-family:var(--sans)}
.chip.resv{background:var(--warn-bg);color:var(--warn-tx);font-family:var(--sans)}
.chip.shut{background:var(--stop-bg);color:var(--stop-tx);font-family:var(--sans)}

.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  font-size:14.5px;font-weight:700;padding:10px 17px;border-radius:999px;background:var(--pink);color:#fff;
  min-height:40px;font-family:var(--sans);box-shadow:0 2px 7px rgba(236,78,140,.28)}
.btn.tab{background:var(--chip);color:var(--pink-deep);box-shadow:none}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px}

.cands{margin-top:11px;display:grid;gap:9px}
.cand{background:var(--card2);border-radius:15px;padding:11px 13px;border:1.5px solid var(--sep2)}
.cand.shut{opacity:.5}
.cand.shut .cnm{text-decoration:line-through;text-decoration-thickness:1.5px}
.cnm{font-family:var(--jp);font-size:15.5px;font-weight:700;line-height:1.35}
.crom{display:block;color:var(--label3);font-size:12.5px;font-weight:400;font-family:var(--sans);margin-top:1px}

.call{margin:16px 16px 0;background:var(--card);border-radius:var(--r);padding:14px 15px;
  border:2px solid var(--amber);box-shadow:var(--shadow)}
.call.risk{border-color:var(--red)} .call.good{border-color:var(--green)}
.call h3{margin:0 0 6px;font-family:var(--jp);font-size:15.5px;font-weight:700}
.call p{margin:0;font-size:14px;color:var(--label2);line-height:1.6} .call p+p{margin-top:8px}
.call b{color:var(--label);font-weight:700}
.cut{margin:16px 16px 0;background:var(--card);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.cut h3{margin:0 0 9px;font-size:13.5px;font-weight:700;color:var(--label2)}
.cut div{font-size:13.5px;color:var(--label3);padding:6px 0;border-top:1.5px dashed var(--sep2);line-height:1.55}
.cut div:first-of-type{border-top:none}
.cut b{color:var(--label2);font-family:var(--jp);font-weight:700}

.ov{padding:12px 16px 0;display:grid;gap:10px}
.ovc{background:var(--card);border-radius:var(--r);padding:14px 15px;display:grid;grid-template-columns:auto 1fr auto;
  gap:12px;align-items:center;cursor:pointer;text-align:left;border:none;font-family:var(--sans);width:100%;
  box-shadow:var(--shadow)}
.ovc i{width:12px;height:12px;border-radius:50%;display:block}
.ovc .t{font-family:var(--jp);font-size:16.5px;font-weight:700;color:var(--label);line-height:1.3;display:block}
.ovc .s{font-size:13.5px;color:var(--label2);margin-top:2px;display:block}
.ovc .d{font-family:var(--mono);font-size:12.5px;color:var(--label3);text-align:right}
.ovc:active{transform:scale(.985)}

.foot{padding:28px 16px 0;color:var(--label3);font-size:12.5px;line-height:1.6}
.foot p{margin:0 0 8px;max-width:60ch}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;transform:none!important}}
</style>
</head>

 call:{cls:"good",h:"本来空掉的早上，变成了最好的一顿",p:["17:20 的飞机，整个上午本来就是空的。筑地周日休市把它逼到了今天，结果反而是最合适的位置。"]}}

var map=L.map("map",{zoomControl:false,attributionControl:false});
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,minZoom:5,crossOrigin:true}).addTo(map);
L.control.attribution({position:"bottomright",prefix:false}).addAttribution("&copy; OpenStreetMap").addTo(map);
var layer=L.layerGroup().addTo(map);

function drawMap(idx){
  layer.clearLayers();
  var pts=[],col=null;
  if(idx<0){
    DAYS.forEach(function(d,i){
      d.ev.forEach(function(e){ if(e.p&&P[e.p]) pts.push([P[e.p][0],P[e.p][1],C[i],P[e.p][2],P[e.p][4]]); });
    });
  }else{
    col=C[idx];
    DAYS[idx].ev.forEach(function(e){ if(e.p&&P[e.p]) pts.push([P[e.p][0],P[e.p][1],col,P[e.p][2],P[e.p][4]]); });
  }
  if(!pts.length){ map.setView([35.30,136.60],7); return; }
  if(idx>=0&&pts.length>1){
    L.polyline(pts.map(function(p){return [p[0],p[1]];}),
      {color:col,weight:3,opacity:.65,dashArray:"5,7"}).addTo(layer);
  }
  pts.forEach(function(p){
    var m=L.circleMarker([p[0],p[1]],{radius:8,color:"#fff",weight:3,fillColor:p[2],fillOpacity:1}).addTo(layer);
    m.bindTooltip(p[3],{direction:"top",offset:[0,-8]});
    m.on("click",function(){ window.open(g(p[4],""),"_blank","noopener"); });
  });
  map.fitBounds(L.latLngBounds(pts.map(function(p){return [p[0],p[1]];})),{padding:[34,34],maxZoom:15});
}

var pills=document.getElementById("pills"), pane=document.getElementById("pane");

function mkPill(label,i,color){
  var b=document.createElement("button");
  b.className="pill"; b.setAttribute("role","tab");
  b.setAttribute("aria-selected", i===-1?"true":"false");
  b.innerHTML=(color?'<i style="background:'+color+'"></i>':"🎀 ")+esc(label);
  b.onclick=function(){show(i);};
  pills.appendChild(b);
}
mkPill("总览",-1,null);
DAYS.forEach(function(d,i){
  var dt=new Date(d.d+"T00:00:00");
  mkPill("D"+(i+1)+" "+(dt.getMonth()+1)+"/"+dt.getDate(),i,C[i]);
});

function payChips(r){
  var out="";
  if(r.pay&&r.pay.indexOf("💳")>=0) out+='<span class="chip pay">可刷卡</span>';
  if(r.pay&&r.pay.indexOf("🍉")>=0) out+='<span class="chip pay">Suica</span>';
  if(!r.pay) out+='<span class="chip cash">可能只收现金</span>';
  if(r.resv) out+='<span class="chip resv">需预约</span>';
  return out;
}

function candCard(key,dow){
  var r=R[key]; if(!r) return "";
  var shut=(r.shut||[]).indexOf(dow)>=0;
  var h='<div class="cand'+(shut?" shut":"")+'">';
  h+='<div class="cnm">'+esc(r.cn)+(r.en?'<span class="crom">'+esc(r.en)+'</span>':"")+'</div>';
  h+='<div class="chips">';
  if(shut) h+='<span class="chip shut">'+W[dow]+' 休息</span>';
  if(r.hrs) h+='<span class="chip">'+esc(r.hrs)+'</span>';
  if(r.yen) h+='<span class="chip yen">¥'+r.yen.toLocaleString()+'</span>';
  h+=payChips(r)+'</div>';
  if(r.note) h+='<div class="note">'+esc(r.note)+'</div>';
  if(!r.nolink){
    h+='<div class="btns"><a class="btn" href="'+g(r.ja||r.cn,r.area)+'" target="_blank" rel="noopener">📍 导航</a>'+
       '<a class="btn tab" href="'+tabelog(r.ja||r.cn)+'" target="_blank" rel="noopener">⭐ 查评分</a></div>';
  }
  return h+'</div>';
}

function show(idx){
  [].forEach.call(pills.children,function(b,j){ b.setAttribute("aria-selected",(j-1)===idx?"true":"false"); });
  drawMap(idx);
  if(idx<0) renderOverview(); else renderDay(idx);
  window.scrollTo(0,0);
}

function renderOverview(){
  var h='<div class="dhead"><h1>'+BOW+'关西 → 关东</h1>'+
    '<div class="sub">大阪2晚 · 京都2晚 · 东京4晚 — 关西机场进，羽田出</div>'+
    '<div class="dt">2026-09-28 → 10-06 · 2人</div></div><div class="ov">';
  DAYS.forEach(function(d,i){
    var dt=new Date(d.d+"T00:00:00");
    h+='<button class="ovc" data-i="'+i+'"><i style="background:'+C[i]+'"></i>'+
       '<span><span class="t">D'+(i+1)+' '+esc(d.t)+'</span><span class="s">'+esc(d.en)+'</span></span>'+
       '<span class="d">'+(dt.getMonth()+1)+'/'+dt.getDate()+'<br>'+W[dt.getDay()]+'</span></button>';
  });
  h+='</div>';
  h+='<div class="call risk"><h3>🎀 出发前必须办掉的事</h3>'+
     '<p><b>嵯峨野小火车 9/30 13:30</b> — 5号车（富贵号）不接受预售，只能当天在龟冈站 09:10 起排队先到先得。13:00 才到＝必然没有。现在就去查 1〜4号车还有没有位。</p>'+
     '<p><b>のぞみ 10/2 京都→东京</b> — 黄金周，务必订指定席，坐 <b>E 席</b>（C、D 都是过道座）。</p>'+
     '<p><b>需要预约</b> — 板前烧肉一斗、祐斋亭、炭烧鳗富士。<b>Suica</b> 出发前就加进 Apple Wallet。</p></div>';
  h+='<div class="call"><h3>🌸 付款提醒</h3>'+
     '<p>标「可能只收现金」的，是笔记里没写明能刷卡或用 IC 的店。日本的个人小店、路边摊、市场至今仍以现金为主。<b>身上随时备 ¥20,000 左右现金。</b></p></div>';
  h+=foot();
  pane.innerHTML=h;
  [].forEach.call(pane.querySelectorAll(".ovc"),function(b){
    b.onclick=function(){ show(parseInt(b.getAttribute("data-i"),10)); };
  });
}

function renderDay(i){
  var d=DAYS[i], dt=new Date(d.d+"T00:00:00"), dow=dt.getDay();
  var h='<div class="dhead"><h1>'+BOW+esc(d.t)+'</h1><div class="sub">'+esc(d.en)+'</div>'+
    '<div class="dt">'+d.d+' · '+W[dow]+'</div></div>';
  if(d.badges) h+='<div class="badges">'+d.badges.map(function(b){
    return '<span class="badge '+b[0]+'">'+esc(b[1])+'</span>';}).join("")+'</div>';
  h+='<div class="tl">';
  d.ev.forEach(function(e){
    h+='<div class="row" data-k="'+(e.k||"")+'"><div class="rt">'+esc(e.t)+'</div>'+
       '<div class="rb" style="--dc:'+C[i]+'"><div class="card">';
    h+='<div class="nm">'+esc(e.n)+'</div>';
    if(e.en) h+='<div class="en">'+esc(e.en)+'</div>';
    if(e.m) h+='<div class="meta">'+esc(e.m)+'</div>';
    if(e.note) h+='<div class="note">'+e.note+'</div>';
    if(e.p&&P[e.p]) h+='<div class="btns"><a class="btn" href="'+g(P[e.p][4],"")+'" target="_blank" rel="noopener">📍 导航</a></div>';
    if(e.c&&e.c.length) h+='<div class="cands">'+e.c.map(function(k){return candCard(k,dow);}).join("")+'</div>';
    h+='</div></div></div>';
  });
  h+='</div>';
  if(d.call) h+='<div class="call '+(d.call.cls||"")+'"><h3>'+esc(d.call.h)+'</h3>'+
    d.call.p.map(function(p){return "<p>"+p+"</p>";}).join("")+'</div>';
  if(d.cut) h+='<div class="cut"><h3>✂️ 今天砍掉的</h3>'+d.cut.map(function(c){
    return '<div><b>'+esc(c[0])+'</b> — '+esc(c[1])+'</div>';}).join("")+'</div>';
  h+=foot();
  pane.innerHTML=h;
}

function foot(){
  return '<div class="foot"><div class="legend">'+
   '<span class="chip pay">可刷卡</span><span class="chip pay">Suica</span>'+
   '<span class="chip cash">可能只收现金</span><span class="chip resv">需预约</span></div>'+
   '<p>「导航」开 Google 地图（用日文店名搜索，日本当地才搜得准），「查评分」开 Tabelog 看营业时间、定休日和评分。地图上的粉点也可以直接点。</p>'+
   '<p>营业时间、休息日、价格来自你自己的笔记；新增的部分已于 2026-09-22 用 Tabelog 和店家官网核对。日本比上海快1小时。重要的当天一定再确认一次。</p></div>';
}

show(-1);
setTimeout(function(){ map.invalidateSize(); },150);
window.addEventListener("resize",function(){ map.invalidateSize(); });
window.addEventListener("orientationchange",function(){ setTimeout(function(){map.invalidateSize();},250); });

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
